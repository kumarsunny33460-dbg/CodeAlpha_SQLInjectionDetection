# ===================================================================
# Railway deployment configuration for SQLShield
# https://docs.railway.app/reference/config-as-code
# ===================================================================

[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn --config deploy/gunicorn.conf.py wsgi:application"
healthcheckPath = "/health/live"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

[nixpacks]
python = "3.12"
